name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".kiro/hooks/scripts/check-evidence-language.sh"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".kiro/hooks/scripts/check-evidence-language.sh"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run inside a container so the database service is reachable by its name, "postgis",
    # the only host pytest-socket allows (backend/pyproject.toml).
    container: python:3.12-slim-bookworm
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          # Throwaway credentials for the CI-only test database.
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eco_test
        options: >-
          --health-cmd "pg_isready -U test -d eco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@postgis:5432/eco_test
      UV_PYTHON_DOWNLOADS: never
      UV_FROZEN: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "~=0.13.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict, application and tests)
        run: uv run mypy --strict .

      - name: Pytest (unit, property and PostGIS integration tests)
        run: uv run pytest -q

      - name: Evidence language scan
        working-directory: ${{ github.workspace }}
        run: bash .kiro/hooks/scripts/check-evidence-language.sh
