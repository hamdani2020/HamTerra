name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".kiro/hooks/scripts/check-evidence-language.sh"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".kiro/hooks/scripts/check-evidence-language.sh"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: ESLint and TypeScript
        run: npm run check

      - name: Vitest (no network; unmocked requests fail)
        run: npm run test -- --run

      - name: Production build
        # Placeholder public values: the build refuses to run without them.
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
          VITE_COGNITO_DOMAIN: https://example.auth.eu-west-1.amazoncognito.com
          VITE_COGNITO_CLIENT_ID: exampleclientid
          VITE_COGNITO_REGION: eu-west-1
          VITE_REDIRECT_URI: http://localhost:5173/auth/callback
          VITE_LOGOUT_URI: http://localhost:5173/signed-out
        run: npm run build

      - name: Evidence language scan
        working-directory: ${{ github.workspace }}
        run: bash .kiro/hooks/scripts/check-evidence-language.sh
